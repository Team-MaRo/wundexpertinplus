# Grype configuration. Auto-discovered by `grype` when invoked from this
# directory, so ci.yml's vulnerability scan step picks it up without needing
# an explicit `--config` flag.
#
# Each ignore entry records WHY the vulnerability is not actionable so a future
# reader can audit the suppression. Remove an entry as soon as the upstream fix
# lands in our nixpkgs channel (currently `nixos-26.05`).

ignore:
  # CVE-2026-119373 / CVE-2026-119374 / CVE-2026-119379 (High) — sqlite
  # 3.53.3 issues, all fixed in sqlite 3.54.0. Reported by Grype because
  # nixos-26.05 has not yet backported the 3.54.0 release; the runtime closure
  # still ships 3.53.3.
  #
  # Why ignored:
  #   - The application does not import `node:sqlite`, never opens a database,
  #     and parses no untrusted SQL — none of the affected code paths are
  #     reachable at runtime.
  #   - sqlite is in the closure only because `nodejs-slim` retains a reference
  #     to `sqlite-*-dev` (pkgconfig + headers). Node's built-in `node:sqlite`
  #     statically links sqlite into the `node` binary, so the standalone
  #     sqlite shared library is never loaded at runtime.
  #
  # Remove these entries when nixos-26.05 backports sqlite 3.54.0+. Check via:
  #   nix eval --raw github:NixOS/nixpkgs/nixos-26.05#sqlite.version
  - vulnerability: CVE-2026-119373
  - vulnerability: CVE-2026-119374
  - vulnerability: CVE-2026-119379
